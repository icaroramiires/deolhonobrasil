[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deolhonobrasil"
version = "0.1.0"
description = "Infraestrutura cívica aberta de transparência pública, rastreabilidade de dados oficiais e auditoria assistida."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
  { name = "Comunidade De Olho no Brasil" }
]
dependencies = []

[project.optional-dependencies]
pipeline = [
  "duckdb>=1.1.0",
  "polars>=1.9.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[project.scripts]
donb-ingest = "deolhonobrasil.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
